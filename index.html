      {dept:'ชีวเคมี',code:'BIOCHEM',name:'Papaya POK POK',short:'สกัดดีเอ็นเอจากมะละกอด้วยขั้นตอนง่าย ๆ และอุปกรณ์ใกล้ตัว พร้อมรู้จักพื้นฐานชีวเคมี',full:'เรียนรู้ความลับทางพันธุกรรมของสิ่งมีชีวิตผ่านการสกัดและสัมผัสดีเอ็นเอจากมะละกอ โดยใช้ขั้นตอนง่าย ๆ และอุปกรณ์ที่หาได้ในครัวเรือน เป็นกิจกรรมแนะนำโลกของชีวเคมีและการค้นพบทางวิทยาศาสตร์',d1:['15:30–16:30'],d2:['11:30–12:30']},
      {dept:'วัสดุศาสตร์',code:'MATSCI',name:'Little Beads, Big Ideas',short:'ออกแบบพวงกุญแจจากลูกปัดพอลิเมอร์ แล้วใช้ความร้อนรีดให้ติดกันเป็นรูปร่างที่ต้องการ',full:'ใช้ลูกปัดพอลิเมอร์จัดเรียงเป็นพวงกุญแจตามรูปร่างที่กำหนด จากนั้นใช้ความร้อนรีดให้เม็ดลูกปัดหลอมติดกันเป็นรูปที่ต้องการ',d1:['13:00–14:00','15:30–16:30'],d2:['09:00–10:00','11:30–12:30']},

      {dept:'หลักสูตรเคมีประยุกต์ & ภาควิชาเคมี',code:'BSAC & CHEM',name:'Perfume',short:'ทดลองดมและผสมน้ำหอม เรียนรู้ Top, Middle, Base note และการระเหยของสารให้กลิ่น',full:'เรียนรู้โครงสร้างของกลิ่นน้ำหอม ได้แก่ Top, Middle และ Base note ผ่านการทดลองดมกลิ่น ทายประเภทกลิ่น และผสมกลิ่นเพื่อสร้างน้ำหอมสูตรของตนเอง สังเกตการเปลี่ยนแปลงของกลิ่นตามเวลาและเชื่อมโยงกับหลักการทางเคมีเรื่องการระเหยและคุณสมบัติของสารให้กลิ่น',d1:['13:00–14:00','16:45–17:45'],d2:['09:00–10:00','12:45–13:45']},

    let selectedDay='d1', viewMode='schedule';
    const cards=document.getElementById('cards'), scheduleList=document.getElementById('scheduleList'), search=document.getElementById('search');
    const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function render(){
      const q=search.value.trim().toLocaleLowerCase('th');
      const list=workshops.filter(w=>{
        const dayMatch=selectedDay==='all'||w[selectedDay].length>0;
        return dayMatch&&(w.name+' '+w.dept+' '+w.code).toLocaleLowerCase('th').includes(q);
      });
      document.getElementById('dayTitle').textContent=selectedDay==='d1'?'กิจกรรมวันที่ 31 ต.ค. 2569':selectedDay==='d2'?'กิจกรรมวันที่ 1 พ.ย. 2569':'กิจกรรมทั้งหมด';
      document.getElementById('count').textContent=`แสดง ${list.length} จาก ${workshops.length} กิจกรรม`;
      if(viewMode==='schedule'){
        cards.hidden=true;scheduleList.hidden=false;
        const days=selectedDay==='d1'?[['d1','31 ต.ค. 2569']]:selectedDay==='d2'?[['d2','1 พ.ย. 2569']]:[['d1','31 ต.ค. 2569'],['d2','1 พ.ย. 2569']];
        scheduleList.innerHTML=list.length?days.map(([key,date])=>{
          const entries=list.flatMap(w=>w[key].map(time=>({time,w}))).sort((a,b)=>a.time.localeCompare(b.time)||a.w.name.localeCompare(b.w.name));
          const rows=entries.map(({time,w})=>`<div class="schedule-row"><div class="schedule-time">${time}</div><div class="schedule-label"><button type="button" class="schedule-name" data-workshop="${esc(w.code)}" aria-label="ดูรายละเอียด ${esc(w.name)} จากภาควิชา ${esc(w.dept)}">${esc(w.name)}</button><span class="schedule-dept">— ${esc(w.code)}</span></div></div>`).join('');
          const noRounds=workshops.filter(w=>!w[key].length&&(w.name+' '+w.dept+' '+w.code).toLocaleLowerCase('th').includes(q));
          const noRoundNote=noRounds.length?`<p class="schedule-no-rounds">ไม่มีรอบในวันนี้: ${noRounds.map(w=>`${esc(w.code)} (${esc(w.dept)})`).join(', ')}</p>`:'';
          return `<section class="schedule-day"><h3>${date}</h3>${rows||'<div class="schedule-empty">ไม่มีกิจกรรมในวันที่เลือก</div>'}${noRoundNote}</section>`;
        }).join(''):'<div class="empty">ไม่พบกิจกรรมที่ตรงกับคำค้น</div>';
        scheduleList.querySelectorAll('.schedule-name').forEach(button=>button.addEventListener('click',()=>showDetails(workshops.find(w=>w.code===button.dataset.workshop))));
        return;
      }
      cards.hidden=false;scheduleList.hidden=true;
      cards.innerHTML=list.length?list.map(w=>{
        const day1=w.d1.length?w.d1.map(t=>`<span class="time">${t}</span>`).join(''):'<span class="no-time">ไม่มีรอบ</span>';
        const day2=w.d2.length?w.d2.map(t=>`<span class="time">${t}</span>`).join(''):'<span class="no-time">ไม่มีรอบ</span>';
        const schedule=selectedDay==='d1'?`<div class="dept">31 ต.ค. 2569</div><div class="times">${day1}</div>`:selectedDay==='d2'?`<div class="dept">1 พ.ย. 2569</div><div class="times">${day2}</div>`:`<div class="dept">31 ต.ค. 2569</div><div class="times">${day1}</div><div class="dept">1 พ.ย. 2569</div><div class="times">${day2}</div>`;
        return `<article class="card" tabindex="0" role="button" aria-label="ดูรายละเอียดกิจกรรม ${esc(w.name)}" data-workshop="${esc(w.code)}"><div class="card-top"><div><p class="dept">${esc(w.dept)}</p><h3>${esc(w.name)}</h3></div><span class="code">${esc(w.code)}</span></div><p class="summary-text">${esc(w.short)}</p>${schedule}<p class="card-hint">กดเพื่อดูรายละเอียดกิจกรรม →</p></article>`;
      }).join(''):'<div class="empty">ไม่พบกิจกรรมที่ตรงกับคำค้น</div>';
      cards.querySelectorAll('.card').forEach(card=>{
        const open=()=>showDetails(workshops.find(w=>w.code===card.dataset.workshop));
        card.addEventListener('click',open);
        card.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();open()}});
      });
    }
    const detailDialog=document.getElementById('detailDialog');
    function showDetails(w){
      if(!w)return;
      document.getElementById('dialogDept').textContent=`${w.dept} · ${w.code}`;
      document.getElementById('dialogTitle').textContent=w.name;
      document.getElementById('dialogBody').textContent=w.full;
      const dates=selectedDay==='d1'?[['31 ต.ค. 2569',w.d1]]:selectedDay==='d2'?[['1 พ.ย. 2569',w.d2]]:[['31 ต.ค. 2569',w.d1],['1 พ.ย. 2569',w.d2]];
      document.getElementById('dialogSchedule').innerHTML=dates.map(([date,times])=>`<p class="dept">${date}</p><div class="times">${times.length?times.map(t=>`<span class="time">${t}</span>`).join(''):'<span class="no-time">ไม่มีรอบ</span>'}</div>`).join('');
      detailDialog.showModal();
    }
    document.getElementById('dialogClose').addEventListener('click',()=>detailDialog.close());
    detailDialog.addEventListener('click',event=>{if(event.target===detailDialog)detailDialog.close()});
    document.querySelectorAll('.tab').forEach(btn=>btn.addEventListener('click',()=>{selectedDay=btn.dataset.day;document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-pressed',String(b===btn)));render()}));
    document.querySelectorAll('.view-button').forEach(btn=>btn.addEventListener('click',()=>{viewMode=btn.dataset.view;document.querySelectorAll('.view-button').forEach(b=>b.setAttribute('aria-pressed',String(b===btn)));render()}));
    const themeToggle=document.getElementById('themeToggle');
    let savedTheme=null;try{savedTheme=localStorage.getItem('workshop-theme')}catch{}
    if(savedTheme==='light'||savedTheme==='dark')document.documentElement.dataset.theme=savedTheme;
    function updateThemeButton(){const dark=document.documentElement.dataset.theme==='dark'||(!document.documentElement.dataset.theme&&matchMedia('(prefers-color-scheme: dark)').matches);themeToggle.textContent=dark?'โหมดสว่าง':'โหมดมืด';themeToggle.setAttribute('aria-label',dark?'เปลี่ยนเป็นธีมสว่าง':'เปลี่ยนเป็นธีมมืด');}
    themeToggle.addEventListener('click',()=>{const currentDark=document.documentElement.dataset.theme==='dark'||(!document.documentElement.dataset.theme&&matchMedia('(prefers-color-scheme: dark)').matches);const next=currentDark?'light':'dark';document.documentElement.dataset.theme=next;try{localStorage.setItem('workshop-theme',next)}catch{}updateThemeButton()});
    search.addEventListener('input',render);updateThemeButton();render();
  </script>
</body>
</html>
