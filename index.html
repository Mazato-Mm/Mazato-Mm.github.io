<!doctype html>
<html lang="th">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <style>
            :root {

                --ink: #172033;
                --muted: #58647a;
                --line: #bdc8d8;
                --paper: #fff;
                --bg: #f5f7fb;
                --blue: #2457c5;
                --soft: #f1f4f8;
                --soft-ink: #45516a;
                --chip: #234a9c;
                --chip-bg: #e5edff;
                --empty: #fff
            }

            :root[data-theme="dark"] {
                color-scheme: dark;
                --ink: #edf2fc;
                --muted: #b2bfd3;
                --line: #58667c;
                --paper: #202a3a;
                --bg: #131b28;
                --blue: #a9c4ff;
                --soft: #303c4e;
                --soft-ink: #d7e0ef;
                --chip: #d3e1ff;
                --chip-bg: #2a3d5d;
                --empty: #202a3a
            }

            @media(prefers-color-scheme: dark) {
                :root:not([data-theme="light"]) {
                    color-scheme:dark;
                    --ink: #edf2fc;
                    --muted: #b2bfd3;
                    --line: #58667c;
                    --paper: #202a3a;
                    --bg: #131b28;
                    --blue: #a9c4ff;
                    --soft: #303c4e;
                    --soft-ink: #d7e0ef;
                    --chip: #d3e1ff;
                    --chip-bg: #2a3d5d;
                    --empty: #202a3a
                }
            }

            * {
                box-sizing: border-box
            }

            [hidden] {
                display: none!important
            }

            body {
                margin: 0;
                background: var(--bg);
                color: var(--ink);
                font-family: "Noto Sans Thai",Tahoma,"Leelawadee UI",sans-serif;
                line-height: 1.6
            }

            .wrap {
                width: min(1100px,calc(100% - 36px));
                margin: auto
            }

            .hero {
                padding: 42px 0 24px
            }

            .eyebrow {
                margin: 0 0 8px;
                color: var(--blue);
                font-size: .88rem;
                font-weight: 700;
                letter-spacing: .02em
            }

            h1 {
                font-size: clamp(1.8rem,4vw,2.65rem);
                line-height: 1.25;
                margin: 0 0 8px;
                letter-spacing: -.03em
            }

            .subtitle {
                color: var(--muted);
                margin: 0;
                max-width: 680px
            }

            .summary {
                display: flex;
                gap: 10px;
                flex-wrap: wrap;
                margin-top: 22px
            }

            .pill {
                background: var(--paper);
                border: 1.5px solid var(--line);
                border-radius: 999px;
                padding: 7px 13px;
                color: var(--muted);
                font-size: .9rem
            }

            .pill strong {
                color: var(--ink)
            }

            .toolbar {
                position: sticky;
                top: 0;
                z-index: 2;
                padding: 12px 0;
                background: var(--bg);
                border-bottom: 2px solid var(--line)
            }

            .controls {
                display: flex;
                gap: 12px;
                align-items: center;
                justify-content: space-between;
                flex-wrap: wrap
            }

            .tabs {
                display: flex;
                gap: 8px;
                flex-wrap: wrap
            }

            .tab,.theme-toggle {
                border: 1.5px solid var(--line);
                background: var(--paper);
                color: var(--ink);
                border-radius: 9px;
                padding: 9px 14px;
                font: inherit;
                font-size: .93rem;
                cursor: pointer
            }

            .tab[aria-pressed="true"] {

                border-color: var(--blue);
                color: #fff
            }

            .tools {
                display: flex;
                gap: 8px;
                align-items: center
            }

            .search {
                width: min(320px,100%);
                border: 1.5px solid var(--line);
                border-radius: 9px;
                padding: 10px 13px;
                background: var(--paper);
                color: var(--ink);
                font: inherit;
                outline: none
            }

            .search::placeholder {
                color: var(--muted)
            }

            .search:focus,.tab:focus-visible,.theme-toggle:focus-visible,summary:focus-visible {
                outline: 3px solid #8eafff;
                outline-offset: 2px
            }

            .section-head {

                justify-content: space-between;
                align-items: baseline;
                gap: 12px;
                margin: 25px 0 12px
            }

            .section-head h2 {
                font-size: 1.2rem;
                margin: 0

            .section-head span {
                color: var(--muted);
                font-size: .9rem
            }

            .grid {

                grid-template-columns: repeat(2,minmax(0,1fr));
                gap: 14px;
                padding-bottom: 38px
            }

            .card {
                background: var(--paper);
                border: 1.5px solid var(--line);
                border-radius: 13px;
                padding: 17px 18px;
                box-shadow: 0 2px 7px rgba(20,35,65,.06)
            }

            .card-top {
                display: flex;
                justify-content: space-between;
                gap: 12px;
                align-items: flex-start
            }

            .dept {
                color: var(--muted);
                font-size: .83rem;
                margin: 0 0 3px

            .card h3 {
                font-size: 1.13rem;
                line-height: 1.35;

            .code {

                background: var(--soft);
                color: var(--soft-ink);

                padding: 3px 8px;
                font-size: .78rem;

                border-radius: 7px;

                background: var(--soft);
                color: var(--muted);
                padding: 5px 9px;
                border-radius: 7px;
                font-size: .84rem
            }

                padding-top: 9px;
                margin-top: 10px
            }

            summary {
                color: var(--blue);
                font-size: .88rem;
                font-weight: 600;
                cursor: pointer;
                list-style: none
            }

            summary::-webkit-details-marker {
                display: none
            }

            summary:after {
                content: "＋";
                float: right
            }

            details[open] summary:after {
                content: "−"
            }

                font-size: .9rem;

            .empty {
                grid-column: 1/-1;
                background: var(--empty);

                border-radius: 12px;
                text-align: center;
                padding: 36px;
                color: var(--muted)

                font-size: .84rem

            .card:hover {

                background: rgba(10,17,29,.62);
                backdrop-filter: blur(3px)

            .dialog-content {
                padding: 22px 24px 24px

            .dialog-head {
                display: flex;
                justify-content: space-between;
                align-items: flex-start;
                gap: 16px

            .dialog-head h2 {
                font-size: 1.4rem;
                line-height: 1.35;
                margin: 0
            }

            .dialog-close {
                flex: none;
                border: 1.5px solid var(--line);
                border-radius: 8px;
                background: var(--soft);
                color: var(--ink);
                font: inherit;
                font-size: 1.1rem;
                width: 38px;
                height: 38px;
                cursor: pointer

            .detail-body {
                color: var(--muted);
                margin: 18px 0;
                white-space: pre-line

            .dialog-schedule {
                border-top: 1.5px solid var(--line);
                padding-top: 12px
            }

            .dialog-schedule .dept {
                font-weight: 700;
                margin: 0 0 7px
            }

            .view-switch {
                display: flex;
                gap: 8px;
                margin: 20px 0 0
            }

            .view-button {
                border: 1.5px solid var(--line);
                border-radius: 9px;
                background: var(--paper);
                color: var(--ink);
                padding: 8px 13px;
                font: inherit;
                font-size: .9rem;
                cursor: pointer
            }

            .view-button[aria-pressed="true"] {
                background: var(--blue);
                border-color: var(--blue);
                color: #fff
            }

            .schedule-list {

                gap: 20px;
                padding-bottom: 38px
            }

            .schedule-day h3 {

            .schedule-time {

            .schedule-label {

                align-items: baseline;

                column-gap: 10px

            .schedule-name {

                background: transparent;
                padding: 2px 0;

            .schedule-name:hover {

            .schedule-name:focus-visible {

            }

            .schedule-dept {

            .schedule-no-rounds {

            :root[data-theme="dark"] .schedule-no-rounds {

            .schedule-empty {

            .room-select-grid {
                display: grid;
                grid-template-columns: repeat(2,minmax(0,1fr));

            }

            .room-choice {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 12px;

            }

            .room-choice:hover,.room-choice:focus-visible {

    <body>
        <header class="wrap hero">
            <p class="eyebrow">กิจกรรมเวิร์กช็อป</p>
            <h1>ตาราง Workshop</h1>
            <p class="subtitle">เลือกดูกิจกรรมและรอบเวลา อ่านสรุปสั้น ๆ แล้วกดการ์ดกิจกรรมเพื่อเปิดรายละเอียดเพิ่มเติม</p>
            <div class="summary">
                <span class="pill">
                    <strong>9</strong>
                    กิจกรรม
                </span>
                <span class="pill">31 ต.ค. – 1 พ.ย. 2569</span>
                <span class="pill">เวลาแสดงตามรอบกิจกรรม</span>
            </div>
        </header>
        <nav class="toolbar" aria-label="ตัวกรองกิจกรรม">
            <div class="wrap controls">
                <div class="tabs">
                    <button class="tab" data-day="d1" aria-pressed="true">31 ต.ค. 2569</button>
                    <button class="tab" data-day="d2" aria-pressed="false">1 พ.ย. 2569</button>
                    <button class="tab" data-day="all" aria-pressed="false">ทุกวัน</button>
                </div>
                <div class="tools">
                    <input class="search" id="search" type="search" placeholder="ค้นหาชื่อกิจกรรมหรือภาควิชา…" aria-label="ค้นหาชื่อกิจกรรมหรือภาควิชา">
                    <button class="theme-toggle" id="themeToggle" type="button" aria-label="สลับธีม">โหมดมืด</button>
                </div>
            </div>
        </nav>
        <main class="wrap">
            <div class="view-switch" role="group" aria-label="เลือกรูปแบบการแสดงผล">
                <button class="view-button" data-view="schedule" aria-pressed="true">ตารางตามเวลา</button>
                <button class="view-button" data-view="sizes" aria-pressed="false">ตารางตามไซส์</button>
                <button class="view-button" data-view="cards" aria-pressed="false">รายการกิจกรรม</button>
            </div>
            <div class="section-head">
                <h2 id="dayTitle">กิจกรรมทั้งหมด</h2>
                <span id="count" aria-live="polite"></span>
            </div>
            <section class="grid" id="cards" aria-label="รายการกิจกรรม"></section>
            <section class="schedule-list" id="scheduleList" aria-label="ตารางกิจกรรมตามเวลาและไซส์ห้อง" hidden></section>
        </main>
        <dialog class="detail-dialog" id="detailDialog" aria-labelledby="dialogTitle">
            <div class="dialog-content">
                <div class="dialog-head">
                    <div>
                        <p class="dept" id="dialogDept"></p>
                        <h2 id="dialogTitle"></h2>
                    </div>
                    <button class="dialog-close" id="dialogClose" type="button" aria-label="ปิดรายละเอียด">×</button>
                </div>
                <p class="detail-body" id="dialogBody"></p>
                <div class="dialog-schedule" id="dialogSchedule"></div>
            </div>
        </dialog>
        <footer>
            <div class="wrap">กำหนดการ Workshop · 31 ตุลาคม – 1 พฤศจิกายน 2569</div>
        </footer>
        <script>
            const workshops = [{
                dept: 'ธรณีวิทยา',
                code: 'GEO',

            }
            const detailDialog = document.getElementById('detailDialog');
            function showDetails(w) {
                if (!w)
                    return;
                document.getElementById('dialogDept').textContent = `${w.dept} · ${w.code}`;
                document.getElementById('dialogTitle').textContent = w.name;
                document.getElementById('dialogBody').textContent = w.full;
                const dates = selectedDay === 'd1' ? [['31 ต.ค. 2569', w.d1]] : selectedDay === 'd2' ? [['1 พ.ย. 2569', w.d2]] : [['31 ต.ค. 2569', w.d1], ['1 พ.ย. 2569', w.d2]];
                document.getElementById('dialogSchedule').innerHTML = dates.map( ([date,sessions]) => `<p class="dept">${date}</p><div class="times">${sessions.length ? sessions.map(s => `<span class="time">${s.time} · ${s.room} · ${s.seats} คน · รอบ ${s.round}</span>`).join('') : '<span class="no-time">ไม่มีรอบ</span>'}</div>`).join('');
                detailDialog.showModal();
            }
            document.getElementById('dialogClose').addEventListener('click', () => detailDialog.close());
            detailDialog.addEventListener('click', event => {
                if (event.target === detailDialog)
                    detailDialog.close()
            }
            );
            document.querySelectorAll('.tab').forEach(btn => btn.addEventListener('click', () => {
                selectedDay = btn.dataset.day;
                document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-pressed', String(b === btn)));
                render()
            }
            ));
            document.querySelectorAll('.view-button').forEach(btn => btn.addEventListener('click', () => {
                viewMode = btn.dataset.view;
                selectedRoom = null;
                document.querySelectorAll('.view-button').forEach(b => b.setAttribute('aria-pressed', String(b === btn)));
                render()
            }
            ));
            const themeToggle = document.getElementById('themeToggle');
            let savedTheme = null;
            try {
                savedTheme = localStorage.getItem('workshop-theme')
            } catch {}
            if (savedTheme === 'light' || savedTheme === 'dark')
                document.documentElement.dataset.theme = savedTheme;
            function updateThemeButton() {
                const dark = document.documentElement.dataset.theme === 'dark' || (!document.documentElement.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches);
                themeToggle.textContent = dark ? 'โหมดสว่าง' : 'โหมดมืด';
                themeToggle.setAttribute('aria-label', dark ? 'เปลี่ยนเป็นธีมสว่าง' : 'เปลี่ยนเป็นธีมมืด');
            }
            themeToggle.addEventListener('click', () => {
                const currentDark = document.documentElement.dataset.theme === 'dark' || (!document.documentElement.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches);
                const next = currentDark ? 'light' : 'dark';
                document.documentElement.dataset.theme = next;
                try {
                    localStorage.setItem('workshop-theme', next)
                } catch {}
                updateThemeButton()
            }
            );
            search.addEventListener('input', render);
            updateThemeButton();
            render();
        </script>
    </body>
</html>
